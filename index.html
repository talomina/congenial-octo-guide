<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルボバス時刻表</title>
<style>
    :root {
        --accent: #0e7a5f;
        --accent-soft: #e3f4ee;
        --ink: #1c2420;
        --muted: #68736d;
        --line: #e2e8e4;
        --card: #ffffff;
        --page: #eef3f0;
        --next-bg: #0b3d2e;
        --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --accent: #2fbf9a;
            --accent-soft: #14332a;
            --ink: #e8efec;
            --muted: #9aa8a1;
            --line: #2a3530;
            --card: #171d1a;
            --page: #0e1210;
            --next-bg: #0f2e24;
        }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
        background: var(--page);
        color: var(--ink);
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 28px; }

    header.hero {
        margin: 0 -14px;
        padding: 26px 20px 20px;
        background: linear-gradient(135deg, #0b3d2e 0%, #0e7a5f 55%, #12a594 100%);
        color: #fff;
    }
    .hero-inner { max-width: 612px; margin: 0 auto; }
    .hero .kicker { font-size: .78rem; letter-spacing: .18em; opacity: .85; margin: 0 0 6px; }
    .hero h1 { margin: 0; font-size: 1.65rem; font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
    .hero h1 svg { flex: none; }
    .hero .meta { margin: 8px 0 0; font-size: .85rem; opacity: .9; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .hero .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1rem; }

    .seg {
        display: flex; gap: 4px;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 999px; padding: 4px;
        margin: -18px 0 14px; position: relative;
        box-shadow: 0 6px 18px rgba(11, 61, 46, .12);
    }
    .seg button {
        flex: 1; border: 0; background: transparent; color: var(--muted);
        font: inherit; font-weight: 700; font-size: .95rem;
        padding: 10px 6px; border-radius: 999px; cursor: pointer;
        transition: background .15s, color .15s;
    }
    .seg button.active { background: var(--accent); color: #fff; }

    .next-card {
        background: var(--next-bg); color: #eafaf3;
        border-radius: var(--radius); padding: 16px 18px 14px; margin-bottom: 14px;
    }
    .next-card h2 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .14em; font-weight: 700; opacity: .85; }
    .next-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.14); }
    .next-row:first-of-type { border-top: 0; }
    .next-station { font-weight: 700; font-size: .92rem; white-space: nowrap; }
    .next-time { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .next-time small { font-size: .8rem; font-weight: 600; opacity: .75; margin-right: 6px; }
    .next-count { font-size: .9rem; font-weight: 700; color: #ffd166; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .dir-title {
        display: flex; align-items: center; gap: 8px;
        font-size: 1rem; font-weight: 800; margin: 18px 2px 8px;
    }
    .dir-title::before {
        content: ""; width: 9px; height: 9px; border-radius: 50%;
        background: var(--accent); flex: none;
    }
    .dir-title:first-of-type { margin-top: 2px; }

    .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--radius); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; vertical-align: top; }
    thead th {
        font-size: .82rem; color: var(--muted); font-weight: 700;
        border-bottom: 1px solid var(--line); background: transparent;
    }
    tbody tr { border-bottom: 1px solid var(--line); }
    tbody tr:last-child { border-bottom: 0; }
    tbody tr.now { background: var(--accent-soft); }
    td.hour {
        font-weight: 800; font-size: 1.05rem; white-space: nowrap; width: 3.6em;
        font-variant-numeric: tabular-nums;
    }
    td.hour small { font-size: .72rem; color: var(--muted); font-weight: 600; }
    .mins { display: flex; flex-wrap: wrap; gap: 6px 10px; }
    .min {
        font-size: 1.12rem; font-weight: 600; font-variant-numeric: tabular-nums;
        padding: 1px 7px; border-radius: 8px; line-height: 1.5;
    }
    .min.past { color: var(--muted); opacity: .55; font-weight: 500; }
    .min.next {
        background: var(--accent); color: #fff; font-weight: 800;
        box-shadow: 0 2px 8px rgba(14, 122, 95, .35);
    }
    footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: .8rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
    <header class="hero">
        <div class="hero-inner">
            <p class="kicker">ARBO BUS TIMETABLE</p>
            <h1>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2.5" fill="#ffffff" opacity="0.95"/><rect x="5.5" y="6.5" width="5.5" height="4" rx="0.8" fill="#0e7a5f"/><rect x="13" y="6.5" width="5.5" height="4" rx="0.8" fill="#0e7a5f"/><circle cx="7.5" cy="19" r="1.8" fill="#ffffff"/><circle cx="16.5" cy="19" r="1.8" fill="#ffffff"/><rect x="3" y="17" width="18" height="1.4" fill="#ffffff" opacity="0.7"/></svg>
                アルボバス時刻表
            </h1>
            <p class="meta"><span>2024年4月1日改正</span><span class="clock" id="clock"></span></p>
        </div>
    </header>

    <nav class="seg" aria-label="駅の切り替え">
        <button id="btn-minamitama" class="active" onclick="switchStation('minamitama')">南多摩駅 発着</button>
        <button id="btn-inagi" onclick="switchStation('inagi')">稲城駅 発着</button>
    </nav>

    <section class="next-card" aria-live="polite">
        <h2>次のバス</h2>
        <div id="next-body"></div>
    </section>

    <div id="tables"></div>

    <footer>
        時刻は発車時刻です。道路事情により遅れる場合があります。<br>
        運行のない時間帯は掲載していません。
    </footer>
</div>

<script>
const STATIONS = {
    "minamitama": {
        name: "南多摩駅",
        dirs: [
            { label: "南多摩駅発 ⇒ アルボの丘", short: "駅発（アルボの丘ゆき）",
              rows: [[7, [19]], [18, [24, 51]], [19, [26, 51]], [20, [26, 51]], [21, [26]]] },
            { label: "アルボの丘発 ⇒ 南多摩駅行", short: "アルボの丘発（駅ゆき）",
              rows: [[7, [14]], [18, [46]], [19, [21, 46]], [20, [21, 46]], [21, [21]]] }
        ]
    },
    "inagi": {
        name: "稲城駅",
        dirs: [
            { label: "稲城駅発 ⇒ アルボの丘", short: "駅発（アルボの丘ゆき）",
              rows: [[6, [7, 22, 37, 52]], [7, [7, 29, 43, 58]], [8, [13, 28, 43]], [18, [34]], [19, [4, 36]], [20, [4, 36]], [21, [4, 37, 53]]] },
            { label: "アルボの丘発 ⇒ 稲城駅行", short: "アルボの丘発（駅ゆき）",
              rows: [[6, [0, 15, 30, 45]], [7, [0, 22, 36, 51]], [8, [6, 21, 36, 51]], [18, [27, 54]], [19, [29, 54]], [20, [29, 54]], [21, [29, 46]]] }
        ]
    }
};

let currentStation = "minamitama";

function pad(n) { return String(n).padStart(2, "0"); }

// 閲覧者のタイムゾーンに依らず、日本時間で判定する
function tokyoTime() {
    const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Tokyo", hour: "numeric", minute: "numeric", hourCycle: "h23"
    }).formatToParts(new Date());
    let h = 0, m = 0;
    parts.forEach(p => {
        if (p.type === "hour") h = parseInt(p.value, 10) % 24;
        if (p.type === "minute") m = parseInt(p.value, 10);
    });
    return { hours: h, minutes: m };
}

function nextDeparture(dirObj, nowMin) {
    const times = [];
    dirObj.rows.forEach(([h, ms]) => ms.forEach(m => times.push(h * 60 + m)));
    times.sort((a, b) => a - b);
    for (const t of times) if (t > nowMin) return { at: t, tomorrow: false };
    return { at: times[0], tomorrow: true };
}

function render() {
    const now = tokyoTime();
    const nowMin = now.hours * 60 + now.minutes;
    const st = STATIONS[currentStation];

    document.getElementById("clock").textContent =
        "現在 " + now.hours + ":" + pad(now.minutes) + "（日本時間）";

    // 次のバス
    const nb = document.getElementById("next-body");
    nb.innerHTML = "";
    st.dirs.forEach(d => {
        const nx = nextDeparture(d, nowMin);
        const row = document.createElement("div");
        row.className = "next-row";
        const wait = nx.tomorrow ? (nx.at + 1440 - nowMin) : (nx.at - nowMin);
        row.innerHTML =
            '<span class="next-station">' + d.short + '</span>' +
            '<span class="next-time">' + (nx.tomorrow ? '<small>明日</small>' : '') +
            Math.floor(nx.at / 60) + ':' + pad(nx.at % 60) + '</span>' +
            '<span class="next-count">' + (nx.tomorrow ? '本日は終了' : 'あと ' + wait + ' 分') + '</span>';
        nb.appendChild(row);
    });

    // 時刻表（方向ごと）
    const host = document.getElementById("tables");
    host.innerHTML = "";
    st.dirs.forEach(d => {
        const nx = nextDeparture(d, nowMin);
        const nextAt = nx.tomorrow ? -1 : nx.at;
        const title = document.createElement("h3");
        title.className = "dir-title";
        title.textContent = d.label;
        host.appendChild(title);

        const card = document.createElement("section");
        card.className = "card";
        let rowsHtml = "";
        d.rows.forEach(([h, ms]) => {
            const chips = ms.map(m => {
                const t = h * 60 + m;
                let cls = "min";
                if (t === nextAt) cls += " next";
                else if (t <= nowMin) cls += " past";
                return '<span class="' + cls + '">' + pad(m) + '</span>';
            }).join("");
            rowsHtml += '<tr' + (h === now.hours ? ' class="now"' : '') + '>' +
                '<td class="hour">' + h + '<small> 時</small></td>' +
                '<td><div class="mins">' + chips + '</div></td></tr>';
        });
        card.innerHTML = '<table><thead><tr><th>時</th><th>分</th></tr></thead><tbody>' +
            rowsHtml + '</tbody></table>';
        host.appendChild(card);
    });
}

function switchStation(key) {
    currentStation = key;
    document.getElementById("btn-minamitama").classList.toggle("active", key === "minamitama");
    document.getElementById("btn-inagi").classList.toggle("active", key === "inagi");
    render();
}

render();
setInterval(render, 20000);
</script>
</body>
</html>
